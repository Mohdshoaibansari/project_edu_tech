openapi: "3.1.0"
info:
  title: EduTech — Leave Context API
  description: |
    Workflow-driven leave management — configurable approval chains per tenant.
    Leave types from reference data (not enums). All approvals routed through WorkflowEngine.
    **Phase 1 implementation.** Scaffolded in Phase 0.
  version: "0.1.0"
servers:
  - url: /api/v1
    description: EduTech Backend API
tags:
  - name: Leave Requests
  - name: Leave Approvals

paths:
  /{tenantId}/leaves:
    get:
      tags: [Leave Requests]
      summary: List leave requests (filterable)
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
        - name: student_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses: { "200": { description: Paginated leave list } }
    post:
      tags: [Leave Requests]
      summary: Apply for leave (starts workflow)
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type_code, start_date, end_date, reason]
              properties:
                type_code: { type: string, example: "SICK" }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                reason: { type: string }
                student_id: { type: string }
                staff_id: { type: string }
      responses:
        "200":
          description: Leave created — workflow instance started, emits leave.applied

  /{tenantId}/leaves/{leaveId}:
    get:
      tags: [Leave Requests]
      summary: Get leave request details
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
        - name: leaveId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Leave with workflow status and available transitions

  /{tenantId}/leaves/{leaveId}/action:
    post:
      tags: [Leave Approvals]
      summary: Approve, reject, or transition a leave request (via WorkflowEngine)
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
        - name: leaveId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transition]
              properties:
                transition: { type: string, example: "Approve" }
                comment: { type: string }
      responses:
        "200":
          description: Transition executed — emits leave.approved or workflow.transitioned
        "400":
          description: Transition not available for current state/actor

  /{tenantId}/leaves/{leaveId}/history:
    get:
      tags: [Leave Requests]
      summary: Get workflow history for a leave request
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
        - name: leaveId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Workflow transition history
