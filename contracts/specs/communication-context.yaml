openapi: "3.1.0"
info:
  title: EduTech — Communication Context API
  description: |
    Notification management — event-driven, template-based notifications
    across in-app, email, SMS, and push channels.
    **Phase 1 implementation.** Scaffolded in Phase 0.
  version: "0.1.0"
servers:
  - url: /api/v1
    description: EduTech Backend API
tags:
  - name: Notifications
  - name: Inbox

paths:
  /{tenantId}/notifications:
    get:
      tags: [Notifications]
      summary: List notification type definitions for this tenant
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      responses: { "200": { description: Notification type definitions } }

  /{tenantId}/notifications/inbox:
    get:
      tags: [Inbox]
      summary: Get user's notification inbox
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
        - name: is_read
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20 }
      responses: { "200": { description: Paginated notifications } }

  /{tenantId}/notifications/inbox/{notificationId}/read:
    post:
      tags: [Inbox]
      summary: Mark notification as read
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
        - name: notificationId
          in: path
          required: true
          schema: { type: string }
      responses: { "200": { description: Marked as read } }

  /{tenantId}/notifications/inbox/read-all:
    post:
      tags: [Inbox]
      summary: Mark all notifications as read
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      responses: { "200": { description: All marked as read } }

  /{tenantId}/notifications/preferences:
    get:
      tags: [Notifications]
      summary: Get notification preferences for current user
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      responses: { "200": { description: User notification preferences } }
    put:
      tags: [Notifications]
      summary: Update notification preferences
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel_preferences:
                  type: object
                  description: Per-notification-type channel preferences
                  additionalProperties:
                    type: array
                    items: { type: string, enum: [in_app, email, sms, push] }
      responses: { "200": { description: Preferences updated } }
