version: "3.8"

# ============================================================================
# EduTech — Docker Compose
# ============================================================================
# PostgreSQL, Redis, and SuperTokens are EXTERNALLY MANAGED services.
# They are NOT built or deployed as part of this project.
#
# The backend connects to them via environment variables:
#   DATABASE_URL           — PostgreSQL connection
#   REDIS_URL              — Redis connection (OPTIONAL — backend degrades gracefully)
#   SUPERTOKENS_CONNECTION_URI  — SuperTokens core URL
#   SUPERTOKENS_API_KEY         — SuperTokens API key
#
# ============================================================================
# LOCAL DEVELOPMENT ONLY
# Uncomment the services below for local development if external services
# are not available. These MUST NOT be used in production deployments.
# ============================================================================

